# Jupyter Book configuration

title: Echoshader
author: Echoshader Contributors
copyright: "2026"

execute:
  execute_notebooks: force
  timeout: 600
  allow_errors: false

repository:
  url: https://github.com/echostack-org/echoshader
  path_to_book: docs/source
  branch: main

html:
  home_page_in_navbar: false
  use_repository_button: true
  use_issues_button: true

sphinx:
  extra_extensions:
    - sphinx_automodapi.automodapi
    - numpydoc
    - sphinx.ext.autodoc
    - sphinx.ext.intersphinx
    - sphinx.ext.mathjax
    - sphinx.ext.githubpages
    - sphinxcontrib.mermaid
  config:
    nb_execution_raise_on_error: true
